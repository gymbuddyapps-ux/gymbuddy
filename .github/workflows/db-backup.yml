# Nightly copy of the Supabase database (Supabase's free plan has no backups).
# Lives under site/ because only site/ is pushed to GitHub (as the repo's main branch).
# The dump is encrypted before upload because the repo is public.
# Restore steps: supabase/README.md, "Backups".
name: Nightly database backup

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC, early morning in Cairo
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump 17 (must be at least the Supabase Postgres version)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Full path: the runner's default pg_dump is an older version and refuses a newer server.
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --data-only --schema=public --schema=auth --schema=storage --no-owner --no-privileges > backup.sql
          test -s backup.sql
          gzip backup.sql
          gpg --batch --symmetric --cipher-algo AES256 --pinentry-mode loopback --passphrase "$PASSPHRASE" -o backup.sql.gz.gpg backup.sql.gz
          ls -l backup.sql.gz.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 90
